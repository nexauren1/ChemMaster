name: Android build

concurrency:
  group: chemmaster-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.nexauren --project-name chemmaster .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release

      - name: Sign APK for Android installation
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          KEYSTORE="$RUNNER_TEMP/chemmaster-test-signing.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass android -keypass android \
            -alias chemmaster-test \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ChemMaster Test, OU=Android, O=Nexauren, L=Maputo, ST=Maputo, C=MZ"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias chemmaster-test \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$RUNNER_TEMP/app-release-signed.apk" \
            "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/app-release-signed.apk"
          mv "$RUNNER_TEMP/app-release-signed.apk" "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChemMaster-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
